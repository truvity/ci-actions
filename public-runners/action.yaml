name: public-runners
description: >-
  Refuse a self-hosted runner in a PUBLIC repository. Runs on a hosted
  runner itself, before any job that would land on the estate's own
  infrastructure. The rule is the `ci-actions` binary's `public-runners`
  command; this action is a thin wrapper that finds that binary (release
  archive of the pinned tag, or built with Go) and runs it. Needs bash,
  plus curl and tar or Go.

inputs:
  runners:
    description: >-
      The runner labels the caller asked for, whitespace separated. Empty
      entries are ignored, so a caller can pass optional tier inputs
      straight through.
    required: true
  visibility:
    description: >-
      The calling repository's visibility, normally
      `github.event.repository.visibility`. When the event payload carries
      none, the action asks the API with the job's own token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUNNERS: ${{ inputs.runners }}
        VISIBILITY: ${{ inputs.visibility }}
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh"
