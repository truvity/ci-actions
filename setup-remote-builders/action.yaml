# Register the CI plane's warm BuildKit builders as one buildx builder
# (on the development and the stable tiers alike). Rootless buildkitd
# StatefulSets live in the ci-cache namespace of the cluster the runner
# runs in; registered client-side as nodes of a single builder, a
# `docker buildx build --platform linux/amd64,linux/arm64` builds each
# platform on the node that declares it — natively, on a hot layer
# cache. No daemon on the runner (the runner image ships client-only
# docker + buildx), no QEMU.
#
# WHICH nodes is the caller's — an org variable, never a literal here
# (this repository is public; internal DNS is a particular). One entry
# per node, `platforms=endpoint`, whitespace-separated, e.g.
#
#   linux/arm64=tcp://<arm64 builder>:1234 linux/amd64=tcp://<amd64 builder>:1234
#   linux/arm64,linux/amd64=tcp://<one builder>:1234
#
# Two nodes and an immutable registry: a plain `docker buildx build
# --push` on a multi-node builder pushes one node's image under the
# requested tag and then writes the merged manifest list under the
# SAME tag — two writes, one tag — and an immutable repository (every
# stable registry) refuses the second (dms v0.33.0, truvity/dms#13).
# The release pipeline (gemaal ≥ 0.22) therefore never lets buildx
# push a tag: each platform is pushed by digest and the tags are
# written once, after every build landed. With that in place a stable
# release registers both nodes, exactly like a snapshot on devel.
#
# Run it wherever the builders are configured: the step is for a caller that
# HAS a `remote-builders` value (the org variable CI_REMOTE_BUILDERS). Gate it
# on that value being set, not on `runner.environment`. Registry auth is the
# caller's: whatever `docker login` / amazon-ecr-login wrote to
# ~/.docker/config.json is forwarded to the builder at push time, so
# log in BEFORE building, not before registering.
#
# WHICH nodes can also be the RUNNER's: a pool that reaches the builders by
# names of its own (a Fargate task through a private gateway, where an ARC pod
# uses in-cluster names) exports CI_RUNNER_REMOTE_BUILDERS in the same
# format, and it wins over the input. The step logs which source won.
#
# Transport comes from the runner, not from an input: when it provides
# CI_BUILDKIT_TLS_DIR (a directory with ca.pem, cert.pem and key.pem; run
# setup-buildkit-tls first when it passes the PEM variables instead) every node
# is registered with mutual TLS, and CI_BUILDKIT_TLS_SERVERNAME, when set, is the
# certificate name the builders are verified against. Without it the nodes are
# plain TCP.
#
# Builders may be STOPPED while idle and started on demand by a TCP wake proxy
# in front of them. The proxy holds the first connection while the builder
# boots (35-60 s), longer than buildx waits (two 20 s attempts; its --timeout
# flag does not change that), so `docker buildx inspect --bootstrap` is retried
# every 10 s until `wake-timeout` (default 240 s) and each attempt and the total
# wait are logged. A builder that is already up answers the first try.
#
# The logic is the `ci-actions` binary's `remote-builders` command
# (internal/remotebuilders, table-tested); this action is a thin wrapper that
# finds that binary (release archive of the pinned tag, or built with Go) and
# runs it. docker and buildx (through devbox when the project has one) are
# still the commands that run.
name: Setup remote builders
description: Register the CI plane's BuildKit builders as one buildx builder (nodes from a caller variable)

inputs:
  remote-builders:
    description: >-
      Builder nodes, whitespace-separated `platforms=endpoint` entries
      (platforms comma-separated). From the caller's org variable. A runner
      that exports CI_RUNNER_REMOTE_BUILDERS (same format) overrides it, and
      then this input may be empty.
    required: false
    default: ""

  buildx-cache:
    description: >-
      The BuildKit registry-cache reference (`<registry>/<repository>`, no tag)
      of the caller's tier, from its org variable. Optional: the step only
      applies the runner's override. A runner that exports
      CI_RUNNER_BUILDX_CACHE wins over it and the step exports the winner as
      CI_BUILDX_CACHE_FROM (the read reference, always) and as CI_BUILDX_CACHE
      (read and write) for the rest of the job, except on a runner that
      exports CI_RUNNER_CACHE_WRITES=release-credentials: there only
      CI_BUILDX_CACHE_FROM, and the release workflow sets CI_BUILDX_CACHE after
      it assumed its role. Without a runner value, the caller's value (which
      the workflow sets itself) is left alone; CI_BUILDX_CACHE_FROM still names it.
    required: false
    default: ""

  wake-timeout:
    description: >-
      Seconds a builder that does not answer is retried (every 10 s) before the
      step fails, naming the builder. A stopped builder is started on demand by
      a wake proxy that holds the connection while it boots (35-60 s), and
      buildx gives up after about 40 s, so the first job after an idle period
      needs the retry. A builder that is up answers the first try, with no
      wait. 0 is a single attempt.
    required: false
    default: "240"

runs:
  using: composite
  steps:
    - name: Register the remote builders
      shell: bash
      env:
        NODES: ${{ inputs.remote-builders }}
        BUILDX_CACHE: ${{ inputs.buildx-cache }}
        WAKE_TIMEOUT: ${{ inputs.wake-timeout }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh"
