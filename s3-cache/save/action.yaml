name: s3-cache save
description: >-
  Save a cache the way actions/cache/save does, to the CI cache bucket when
  the caller passes one; GitHub's cache otherwise. Decided by what is
  configured, not by the kind of runner. A key that already exists is left alone
  (caches are immutable). Fails open: a bucket that cannot be written is a
  warning, never a failed job. On a runner whose own identity only reads its
  caches (CI_RUNNER_CACHE_WRITES=release-credentials) it saves with the job's
  AWS keys, or is skipped when the job has none. Pair it with s3-cache/restore.

inputs:
  path:
    description: Files or directories to save, one per line. `~` is the home directory. No globs.
    required: true
  key:
    description: The key to save under.
    required: true
  bucket:
    description: >-
      The CI cache bucket, from the CALLER's org variable. A runner that
      exports CI_RUNNER_GOCACHE_S3_BUCKET overrides it. Empty (and no runner
      bucket) uses GitHub's cache. Set, the bucket is tried first, and a runner with no
      usable credentials hands the same key to GitHub's cache.
    required: false
    default: ""
  region:
    description: The bucket's region.
    required: false
    default: ""
  endpoint:
    description: S3 endpoint URL for a store that is not AWS. Empty keeps the AWS default.
    required: false
    default: ""
  path-style:
    description: '"true" to address the bucket path-style.'
    required: false
    default: ""
  prefix:
    description: Key prefix inside the bucket; must match the restore step's.
    required: false
    default: gha-cache
  timeout:
    description: Upper bound for the transfer, a Go duration.
    required: false
    default: 15m

outputs:
  backend:
    description: "`s3` or `github`: which store this step used (`s3` also when the save was skipped, see `skipped`)."
    value: ${{ steps.gh.outcome == 'success' && 'github' || 's3' }}
  skipped:
    description: >-
      'true' when nothing was saved on purpose: the runner's identity only reads
      its cache (CI_RUNNER_CACHE_WRITES=release-credentials) and the job holds no
      AWS credentials of its own. GitHub's cache does not stand in for that save.
    value: ${{ steps.s3.outputs.skipped == 'true' && 'true' || 'false' }}

runs:
  using: composite
  steps:
    # A runner can have a bucket of its own (CI_RUNNER_GOCACHE_S3_BUCKET in its
    # process environment, which an `if:` cannot see), and that wins over the input.
    # This step only asks whether any bucket is named; the binary decides which.
    - id: pick
      shell: bash
      env:
        INPUT_BUCKET: ${{ inputs.bucket }}
      run: |
        if [ -n "$INPUT_BUCKET" ] || [ -n "${CI_RUNNER_GOCACHE_S3_BUCKET:-}" ]; then
          echo "use-bucket=true" >> "$GITHUB_OUTPUT"
        else
          echo "use-bucket=false" >> "$GITHUB_OUTPUT"
        fi

    - id: s3
      if: steps.pick.outputs.use-bucket == 'true'
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        REGION: ${{ inputs.region }}
        ENDPOINT: ${{ inputs.endpoint }}
        PATH_STYLE: ${{ inputs.path-style }}
        PREFIX: ${{ inputs.prefix }}
        TIMEOUT: ${{ inputs.timeout }}
        KEY: ${{ inputs.key }}
        PATHS: ${{ inputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/../run.sh" save

    - id: gh
      # Never after a deliberate skip: GitHub's cache is no stand-in for a save the
      # runner's cache policy refused (skipped is set by the binary or by run.sh).
      if: steps.s3.outputs.skipped != 'true' && (steps.pick.outputs.use-bucket != 'true' || steps.s3.outputs.fallback == 'true')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
