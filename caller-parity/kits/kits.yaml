# Where each kit lives in a consuming repository, and what part of it is
# the shared thing.
#
# A kit with no entry here is a whole file at `.github/workflows/<name>`,
# which is what the first two kits are and what most will be. An entry
# exists for the ones that are not: a block inside a file the repository
# also fills with its own settings, which is what a lint configuration is.
#
# This file is NOT itself a kit. It is skipped by name.

golangci-depguard.yaml:
  # The import bans live inside each repository's own lint configuration,
  # beside settings that are legitimately its own. Comparing the whole
  # file would report every repository as differing over things that are
  # nobody else's business.
  path: .golangci.yaml
  # The subtree to compare, on each side. The kit is a fragment rooted at
  # `depguard:`, because that is the shape somebody pastes; a repository
  # carries it under `linters.settings`.
  compare: .linters.settings.depguard
  within: .depguard
  # OFF, deliberately, and this is the whole lever.
  #
  # golangci-lint v2 cannot extend a configuration from a URL, so the block
  # is a hand copy in every Go repository that has it — nine on
  # 2026-09-23, all byte-identical. A hand copy with no drift detection has
  # a half-life, which is the failure the block itself exists to prevent.
  #
  # It is off rather than absent because the estate-wide pass that will
  # touch all nine repositories is already scheduled, and turning this on
  # at that moment costs one coordination instead of two. Flip it there.
  enabled: false
