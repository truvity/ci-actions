# Shared bootstrap for every bar job (CI, integration, release):
# preflight → AWS CI face → nix → prototools strip → devbox → proto.
#
# Runs with NO privilege, by contract: no root, no privilege escalation, no relinking of
# /bin/sh. Every step that needs bash says `shell: bash`; see CHANGELOG.
#
# ONE root step remains, and only on a runner that has no nix: "Install nix"
# below runs the nix installer, which needs root. It is skipped wherever nix
# is already on PATH (a runner image that bakes it: the ARC pool, an ECS
# Fargate task, a restricted runner), so in practice it runs on GitHub-hosted
# runners, and preflight says so out loud and refuses early when the runner
# has no nix and cannot escalate.
#
# Nothing here asks what KIND of runner it is on. Each step is decided by what
# the runner has or the caller configured: nix on PATH, devbox on PATH, a
# .prototools in the tree, a cache bucket passed in.
# devbox itself is the release binary in $RUNNER_TEMP/bin, checksum-verified,
# with no privilege.
# Checkout must precede this action — GitHub resolves repo-local
# actions from the workspace.
name: Setup runner environment
description: Nix + devbox + proto bootstrap shared by all bar workflows

inputs:
  proto:
    description: >-
      Materialize the proto toolchain. "auto" (the default) installs it
      exactly when the repository has a .prototools, which is the honest
      answer for a SHARED action: defaulting to "true" made every repo
      without proto in its devbox fail at `exit 127` (gitops, every
      recipe, 2026-08-16). "true" forces it, "false" skips it — for jobs
      that only need devbox-shipped CLIs, like the identity canary.
    default: auto
  aws-config-file:
    description: Repo-relative CI-shaped AWS config (e.g. aws-ci.ini). Empty to skip.
    default: ""
  go-cache-bucket:
    description: >-
      Fleet Go build cache bucket. Comes from the CALLER's org variable —
      this repository is public and must never contain it.
    default: ""
  go-cache-region:
    default: ""
  go-cache-endpoint:
    description: >-
      S3 endpoint URL for the Go build cache, for an S3-COMPATIBLE store
      that is not AWS — Cloudflare R2, MinIO, Ceph. Empty keeps the AWS
      default, so every existing caller is unaffected.

      go-cache-plugin already understands this as --s3-endpoint-url /
      GOCACHE_S3_ENDPOINT_URL; the action simply never passed it, which
      made the cache AWS-only by omission rather than by decision.

      From the CALLER's org variable: an endpoint carries an account id,
      and this repository is public.
    default: ""
  go-cache-path-style:
    description: >-
      Address the cache bucket path-style (endpoint/bucket/key) rather
      than virtual-hosted (bucket.endpoint/key). Needed by stores whose
      wildcard certificate does not cover a bucket subdomain, and
      harmless where it is not. "true" to enable.
    default: ""
  goproxy:
    description: >-
      Go module proxy (the caller's CI_GOPROXY). Empty leaves Go's default.
    default: ""
  npm-registry:
    description: >-
      Registry URL for Yarn/npm (the caller's CI_NPM_REGISTRY). Empty leaves
      the repository's own. Checked against .yarnrc.yml, never written.
    default: ""
  bazel-remote:
    description: >-
      gRPC address of a bazel-remote for moon's task cache (the caller's
      CI_BAZEL_REMOTE_CACHE). Empty leaves moon's own configuration alone.
      Checked against .moon/workspace.yml, never written.
    default: ""
  github-token:
    description: Token for proto's GitHub API resolution (rate limits).
    default: ""
  go-private:
    description: >-
      Module path prefix that must bypass the public proxy and sum
      database — e.g. "github.com/truvity". Sets GOPRIVATE, which also
      implies GONOPROXY and GONOSUMDB. Requires module-token to be of
      any use: GOPRIVATE means "fetch this directly over git", and a
      private repository refuses an unauthenticated fetch.
    default: ""
  codeartifact-domain:
    description: >-
      CodeArtifact domain to log into, e.g. "truvity". Empty means the
      repository has no private npm dependencies and the step is
      skipped entirely -- most do not, and an unconditional login would
      make every build pay an STS call for nothing.

      Set it and `yarn install` can reach @scope packages without each
      repository re-implementing the token dance in its own justfile.
    default: ""
  codeartifact-domain-owner:
    description: Account that owns the CodeArtifact domain.
    default: ""
  codeartifact-region:
    description: >-
      Region the domain lives in. NOT necessarily the region the build
      runs in -- truvity's domain is eu-west-1 while the cluster is
      eu-central-1, and defaulting to the caller's region silently
      looks up a domain that does not exist there.
    default: ""
  module-app-client-id:
    description: >-
      Client id of a GitHub App with contents:read on the private
      repositories this build must read. Supplying it mints a token
      whether or not go-private is set: Go modules were the first use,
      reading a sibling repository's files from a recipe is the general
      one. The token also reaches the recipes as CI_CONTENTS_TOKEN.

      The token is minted HERE rather than passed in:
      GitHub strips masked values from job outputs, so a token handed
      down from a previous job arrives empty — which is how this was
      first built, and it failed with the guard below.
    default: ""
  module-app-private-key:
    description: Private key for module-app-client-id.
    default: ""
  devbox-version:
    description: >-
      The devbox release to install when the runner does not bake one: a tag
      such as "0.18.4", or "latest" (the default) for the newest. The release
      binary is checked against that release's own checksums.txt and lands in
      $RUNNER_TEMP/bin; no privilege and no installer script are involved.
      Pin a tag to make the choice of release a reviewed one.
    default: latest
  strip-local-tools:
    description: >-
      Strip the npm-backed cubic CLI from .prototools (workspace copy).
      Required on pristine self-hosted runners where its proto plugin
      cannot bootstrap. Pass "false" on release jobs: goreleaser's
      clean-tree gate refuses a dirty workspace, and GitHub-hosted
      runners have npm, so the plugin bootstraps fine there.
    default: "true"
  devbox-config:
    description: >-
      Directory, relative to the workspace, that holds its own devbox.json
      and devbox.lock: a second, smaller environment than the repository's
      own, so the job downloads that closure instead of the full one. Every
      devbox call here (the materialize step, proto, the CodeArtifact login)
      runs as `devbox run -c <dir>`, which makes that directory devbox's project
      root. `just` still finds the Justfile by searching parent directories,
      so recipes run from the repository root. Must be a relative path inside
      the workspace (no absolute path, no `..` escaping) with a devbox.json
      in it; anything else fails with a message naming the problem. The
      devbox.json guards check that file. Pass the same value to the
      `recipe` action. A second environment that ships no proto needs
      `proto: "false"`. Empty (the default) uses the repository's own
      devbox.json, unchanged.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # First, so a runner that cannot do what the rest of this action
    # needs fails here with one message naming the fix, not forty
    # seconds later as a cryptic error from nix or devbox.
    - name: Preflight
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" preflight
    # Caller-supplied: aws.ini is laptop-shaped (SSO + [default]) and a
    # credential-less step consulting it hangs or dies on SSO. Repos that
    # keep a CI-shaped variant name it here; others leave it empty. Values
    # reach the binary through env, and the value is written to GITHUB_ENV
    # with a random-delimiter heredoc (internal/setupdevbox).
    - name: CI face of the AWS config
      if: inputs.aws-config-file != ''
      shell: bash
      env:
        AWS_CONFIG_REL: ${{ inputs.aws-config-file }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" aws-config
    # A runner image may bake nix (S3 substituter pre-configured in the
    # baked nix.conf) and devbox: installing them again per job was the bulk
    # of the bootstrap minute. Whatever is already on PATH is used; a runner
    # with neither (a GitHub-hosted one) keeps the install path.
    - name: Detect baked tools
      id: baked
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" detect-baked
    - name: Install nix
      # THE ONE REMAINING ROOT STEP: the nix installer needs root. It runs
      # only when nix is not already on PATH (condition below), which in
      # practice is a GitHub-hosted runner; a runner that cannot escalate must
      # bake nix, and preflight fails early, naming that, when it does not.
      #
      # Where nix is baked (ARC, ECS Fargate) its nix.conf carries the
      # estate's substituter; where it is installed here, the upstream cache
      # is used directly.
      #
      # PLAIN upstream nix, NOT determinate-nix-action: every hosted
      # consumer of this composite is a RELEASE job, which must carry
      # `id-token: write` for the AWS OIDC assume — and that is exactly
      # the condition that makes the Determinate action attempt a
      # FlakeHub login the org is not registered for. Both 2026-08-13
      # releases died there ("Logging in to FlakeHub", then cancelled)
      # and were published by hand. Rule: never pair
      # determinate-nix-action with id-token: write
      # (gitops docs/architecture/github-actions.md §The nix installer
      # choice).
      if: steps.baked.outputs.nix != 'true'
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # The npm-backed cubic CLI is LOCAL review tooling; CI never invokes it
    # and its proto plugin cannot bootstrap on a pristine runner. devbox's
    # init hook materializes proto on the FIRST devbox run, so the strip
    # must precede it. Workspace copy only; nothing is committed.
    - name: Strip local-only proto tools
      if: inputs.strip-local-tools == 'true' && steps.baked.outputs.prototools == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" strip-tools
    # The release binary into $RUNNER_TEMP/bin, checksum-verified, no
    # privilege, when the runner does not bake devbox. It used to pipe
    # get.jetify.com into bash, which unpacked into /usr/local/bin through
    # root and ran whatever that script was that day.
    - name: Install devbox
      if: steps.baked.outputs.devbox != 'true'
      shell: bash
      env:
        DEVBOX_VERSION: ${{ inputs.devbox-version }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" install-devbox
    # Split so timings tell the truth: the FIRST devbox invocation
    # transparently fetches, unpacks and registers the whole nix closure.
    # This step is the closure cost; every devbox step after it is only
    # itself.
    - name: Materialize devbox environment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        DEVBOX_CONFIG: ${{ inputs.devbox-config }}
      run: bash "$ACTION_PATH/run.sh" materialize
    - name: Restore proto toolchains from the CI cache bucket
      id: proto-s3
      # proto downloads toolchains from GitHub releases/upstreams — no
      # nix, no S3 cache can help it, and ephemeral runners rebuild it
      # from nothing every job. Keyed on .prototools: a pin bump misses
      # once, then everyone is warm again.
      #
      # Path is the WORKSPACE .proto: bar's devbox pins PROTO_HOME to
      # <repo>/.proto (measured 2026-08-14) — the previous ~/.proto
      # path pointed at a directory nothing writes, so this cache
      # silently neither restored nor saved ("Path Validation Error"
      # in every post step, goreleaser-pro re-downloaded every job).
      #
      # With a bucket configured this rides the bucket (the s3-cache wrapper
      # in this repository), not GitHub's cache: a runner that has one
      # reaches it through a gateway endpoint, GitHub's cache through the
      # NAT. With no bucket, or when the runner has no usable credentials for
      # it, the next step does what this step used to.
      if: (inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')) && inputs.go-cache-bucket != ''
      shell: bash
      env:
        BUCKET: ${{ inputs.go-cache-bucket }}
        REGION: ${{ inputs.go-cache-region }}
        ENDPOINT: ${{ inputs.go-cache-endpoint }}
        PATH_STYLE: ${{ inputs.go-cache-path-style }}
        KEY: proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools') }}
        PATHS: .proto
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/../s3-cache/run.sh" restore
    - name: Cache proto toolchains
      id: proto-gh
      if: (inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')) && (inputs.go-cache-bucket == '' || steps.proto-s3.outputs.fallback == 'true')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .proto
        key: proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools') }}

    # Pure proto now; the closure cost lives in "Materialize devbox
    # environment" above. Retries: proto's plugin fetches are flaky from the
    # NAT'd runner (intermittent non-JSON responses with the token present).
    - name: Install proto toolchain
      if: inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNNER_ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        DEVBOX_CONFIG: ${{ inputs.devbox-config }}
      run: bash "$ACTION_PATH/run.sh" proto
    # Saved right here, not in a post step: a composite action has none, and
    # the toolchains are complete once proto use has run. Only on a miss; a
    # key that exists is immutable in both stores.
    - name: Save proto toolchains to the CI cache bucket
      if: (inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')) && steps.proto-s3.outcome == 'success' && steps.proto-s3.outputs.fallback != 'true' && steps.proto-s3.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUCKET: ${{ inputs.go-cache-bucket }}
        REGION: ${{ inputs.go-cache-region }}
        ENDPOINT: ${{ inputs.go-cache-endpoint }}
        PATH_STYLE: ${{ inputs.go-cache-path-style }}
        KEY: proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools') }}
        PATHS: .proto
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/../s3-cache/run.sh" save
    - name: Save proto toolchains
      if: (inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')) && steps.proto-gh.outcome == 'success' && steps.proto-gh.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .proto
        key: proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools') }}
    # Gated on the App, NOT on go-private. Fetching private Go modules was
    # the first use; reading a sibling repository's files from a recipe is
    # the general one -- TrustForm's OpenAPI contracts sit in a private
    # repository that GITHUB_TOKEN cannot read, which is the same problem
    # wearing different clothes. A caller supplying the App but no
    # go-private now gets a token and no git rewrite, which is exactly
    # what a contracts fetch wants.
    - name: Mint a token for reading private repositories
      if: inputs.module-app-client-id != ''
      id: module-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.module-app-client-id }}
        private-key: ${{ inputs.module-app-private-key }}
        owner: ${{ github.repository_owner }}

    # Hand the token to the recipes as well as to git. A recipe that curls
    # the GitHub API needs the token itself; the credential rewrite below
    # only helps things that speak git.
    #
    # A DISTINCT name, never GH_TOKEN: `gh` reads GH_TOKEN implicitly, so
    # overloading it would silently repoint every unrelated gh call in
    # every recipe at a token scoped to other repositories, and the
    # failure would surface far from here.
      # Hand the token to the recipes as well as to git. A recipe that curls
      # the GitHub API needs the token itself. A DISTINCT name, never GH_TOKEN:
      # `gh` reads GH_TOKEN implicitly, so overloading it would silently repoint
      # every unrelated gh call in every recipe at a token scoped to other
      # repositories.
    - name: Expose the token to recipes
      if: steps.module-token.outputs.token != ''
      shell: bash
      env:
        MODULE_TOKEN: ${{ steps.module-token.outputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" expose-token
    # GOPRIVATE alone is not enough: it tells go to skip the proxy and go
    # straight to git, and git then refuses a private repository with an
    # authentication prompt that CI reports as "terminal prompts disabled".
    # The token arrives through env, is masked first, and the GOPRIVATE value
    # is validated and written with a random-delimiter heredoc.
    - name: Reach private Go modules
      if: inputs.go-private != ''
      shell: bash
      env:
        GO_PRIVATE: ${{ inputs.go-private }}
        MODULE_TOKEN: ${{ steps.module-token.outputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh" go-private
    # The token comes from the DEFAULT credential chain deliberately: on a
    # runner that is the pool's pod identity. Fails LOUDLY on an empty token:
    # an empty one fetches anonymously and fails later as an npm
    # authentication error naming npm while the cause is a missing IAM grant.
    - name: Log in to CodeArtifact
      if: inputs.codeartifact-domain != ''
      shell: bash
      env:
        CA_DOMAIN: ${{ inputs.codeartifact-domain }}
        CA_OWNER: ${{ inputs.codeartifact-domain-owner }}
        CA_REGION: ${{ inputs.codeartifact-region }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        DEVBOX_CONFIG: ${{ inputs.devbox-config }}
      run: bash "$ACTION_PATH/run.sh" codeartifact
    # The caches are wired by the nested setup-cache action, not here.
    #
    # The chart that runs them, the clients that talk to them and the
    # configuration that points one at the other only agree if they are
    # versioned together. They were not, and it showed: an org variable
    # named a Go module proxy that had been removed two releases earlier,
    # GOPROXY used `|` so Go fell through in four milliseconds, and every
    # preview job lost its module cache for days with nothing failing.
    #
    # This action keeps the WHEN -- which jobs get a cache at all -- and
    # setup-cache owns the HOW. Callers keep one pin, to this workflow, and
    # never name the cache action themselves.
    - name: Wire the fleet caches
      uses: truvity/ci-actions/setup-cache@f9130c63db2899c18884c027a7eade20d0ab796a # v1.18.0
      with:
        bucket: ${{ inputs.go-cache-bucket }}
        region: ${{ inputs.go-cache-region }}
        endpoint: ${{ inputs.go-cache-endpoint }}
        path-style: ${{ inputs.go-cache-path-style }}
        goproxy: ${{ inputs.goproxy }}
        npm-registry: ${{ inputs.npm-registry }}
        bazel-remote: ${{ inputs.bazel-remote }}

    - name: Guard GOPROXY against devbox.json
      if: inputs.goproxy != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        DEVBOX_CONFIG: ${{ inputs.devbox-config }}
      run: bash "$ACTION_PATH/run.sh" guard-goproxy
    # The same class of problem as GOPROXY, for the AWS identity: this action
    # points AWS_CONFIG_FILE at the CI config (profiles that take their
    # credentials from the job's OIDC token), and devbox run re-applies the
    # env block over it. Build tooling such as the Go cache plugin then
    # authenticates with the wrong profile and the build runs cold.
    - name: Guard AWS config against devbox.json
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        DEVBOX_CONFIG: ${{ inputs.devbox-config }}
      run: bash "$ACTION_PATH/run.sh" guard-aws
