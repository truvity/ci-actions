# Shared bootstrap for every bar job (CI, integration, release):
# AWS CI face → nix → bash-as-sh → prototools strip → devbox → proto.
# Checkout must precede this action — GitHub resolves repo-local
# actions from the workspace.
name: Setup runner environment
description: Nix + devbox + proto bootstrap shared by all bar workflows

inputs:
  proto:
    description: >-
      Materialize the proto toolchain. "auto" (the default) installs it
      exactly when the repository has a .prototools, which is the honest
      answer for a SHARED action: defaulting to "true" made every repo
      without proto in its devbox fail at `exit 127` (gitops, every
      recipe, 2026-08-16). "true" forces it, "false" skips it — for jobs
      that only need devbox-shipped CLIs, like the identity canary.
    default: auto
  aws-config-file:
    description: Repo-relative CI-shaped AWS config (e.g. aws-ci.ini). Empty to skip.
    default: ""
  go-cache-bucket:
    description: >-
      Fleet Go build cache bucket. Comes from the CALLER's org variable —
      this repository is public and must never contain it.
    default: ""
  go-cache-region:
    default: ""
  goproxy:
    description: In-cluster Go module proxy with a public fallback.
    default: ""
  github-token:
    description: Token for proto's GitHub API resolution (rate limits).
    default: ""
  go-private:
    description: >-
      Module path prefix that must bypass the public proxy and sum
      database — e.g. "github.com/truvity". Sets GOPRIVATE, which also
      implies GONOPROXY and GONOSUMDB. Requires module-token to be of
      any use: GOPRIVATE means "fetch this directly over git", and a
      private repository refuses an unauthenticated fetch.
    default: ""
  module-app-client-id:
    description: >-
      Client id of a GitHub App with contents:read on the private
      repositories this build must read. Supplying it mints a token
      whether or not go-private is set: Go modules were the first use,
      reading a sibling repository's files from a recipe is the general
      one. The token also reaches the recipes as CI_CONTENTS_TOKEN.

      The token is minted HERE rather than passed in:
      GitHub strips masked values from job outputs, so a token handed
      down from a previous job arrives empty — which is how this was
      first built, and it failed with the guard below.
    default: ""
  module-app-private-key:
    description: Private key for module-app-client-id.
    default: ""
  strip-local-tools:
    description: >-
      Strip the npm-backed cubic CLI from .prototools (workspace copy).
      Required on pristine self-hosted runners where its proto plugin
      cannot bootstrap. Pass "false" on release jobs: goreleaser's
      clean-tree gate refuses a dirty workspace, and GitHub-hosted
      runners have npm, so the plugin bootstraps fine there.
    default: "true"

runs:
  using: composite
  steps:
    - name: CI face of the AWS config
      # Caller-supplied: aws.ini is laptop-shaped (SSO + [default]) and a
      # credential-less step consulting it hangs or dies on SSO. Repos that
      # keep a CI-shaped variant name it here; others leave it empty.
      if: inputs.aws-config-file != ''
      shell: bash
      # Values reach the shell through env, never through ${{ }} spliced
      # into the script text: an expression is pasted in BEFORE bash sees
      # the line, so a value containing a quote or $( ) would execute.
      # Callers here are trusted, but this action is public and its next
      # caller may not be. Same reason for every env: block below.
      # Heredoc write with a random delimiter: GITHUB_ENV is
      # line-oriented, so a value carrying a newline in the NAME=VALUE
      # form writes a second variable of the caller's choosing (CodeQL
      # envvar-injection). The delimiter is unguessable, so the value
      # cannot terminate the block early either.
      run: |
        set -euo pipefail
        d="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        printf '%s<<%s\n%s\n%s\n' AWS_CONFIG_FILE "$d" "$GITHUB_WORKSPACE/$AWS_CONFIG_REL" "$d" >> "$GITHUB_ENV"
      env:
        AWS_CONFIG_REL: ${{ inputs.aws-config-file }}

    - name: Detect baked tools
      # The runner image bakes nix (S3 substituter pre-configured in
      # the baked nix.conf) and devbox — installing them again per job
      # was the bulk of the bootstrap minute. GitHub-hosted runners
      # (release jobs) have neither and keep the install path.
      id: baked
      shell: bash
      run: |
        echo "nix=$(command -v nix >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "devbox=$(command -v devbox >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Same principle one layer up: ask the repository what it needs
        # rather than making every caller declare it.
        echo "prototools=$([ -f .prototools ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Install nix
      # GitHub-hosted runners only (ARC runners bake nix, with the
      # in-cluster read-through substituter in the baked nix.conf —
      # unreachable from outside the VPC anyway, so hosted jobs just
      # use the upstream cache directly).
      #
      # PLAIN upstream nix, NOT determinate-nix-action: every hosted
      # consumer of this composite is a RELEASE job, which must carry
      # `id-token: write` for the AWS OIDC assume — and that is exactly
      # the condition that makes the Determinate action attempt a
      # FlakeHub login the org is not registered for. Both 2026-08-13
      # releases died there ("Logging in to FlakeHub", then cancelled)
      # and were published by hand. Rule: never pair
      # determinate-nix-action with id-token: write
      # (gitops docs/architecture/github-actions.md §The nix installer
      # choice).
      if: steps.baked.outputs.nix != 'true'
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Use bash as sh
      # devbox/moon scripts assume bash semantics; self-hosted runner
      # images and GitHub-hosted ubuntu both ship dash as /bin/sh.
      shell: bash
      run: sudo ln -sf /bin/bash /bin/sh

    - name: Strip local-only proto tools
      # The npm-backed cubic CLI is LOCAL review tooling — CI never
      # invokes it, and its proto plugin cannot bootstrap on a pristine
      # runner (the plugin execs npm mid-materialization). devbox's
      # init hook materializes proto on the FIRST devbox run, so the
      # strip must precede it. Workspace copy only; nothing is
      # committed.
      #
      # Nothing to strip in a repo with no .prototools, which is most of
      # them — this step came from bar, where the file always exists, and
      # `sed` on a missing file exits 2 and takes the whole bootstrap with
      # it. A shared action may not assume one repository's layout.
      if: inputs.strip-local-tools == 'true' && steps.baked.outputs.prototools == 'true'
      shell: bash
      run: |
        [ -f .prototools ] || { echo "no .prototools; nothing to strip"; exit 0; }
        sed -i '/@cubic-dev-ai/d' .prototools
        # The strip modifies a TRACKED file. goreleaser reads `git
        # status` and stamped every snapshot "dirty" over it (a release
        # build REFUSES outright on dirty). The mutation is CI
        # plumbing, not source — hide it from the index.
        git update-index --assume-unchanged .prototools

    - name: Install devbox
      if: steps.baked.outputs.devbox != 'true'
      shell: bash
      run: curl -fsSL https://get.jetify.com/devbox | bash -s -- -f

    - name: Materialize devbox environment
      # Split so timings tell the truth (Oleg, 2026-08-14): the FIRST
      # devbox invocation transparently fetches, unpacks and registers
      # the whole nix closure — hidden inside whatever step happened to
      # run devbox first ("Install proto toolchain" showed 1m28s of
      # which ~85s was this). This step is the closure cost; every
      # devbox step after it is only itself.
      shell: bash
      run: |
        retry() { for i in 1 2; do "$@" && return 0; echo "attempt $i failed; sleeping"; sleep 20; done; "$@"; }
        START=$(date +%s)
        retry devbox run -- true
        echo "- devbox closure: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    - name: Cache proto toolchains
      if: inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')
      # proto downloads toolchains from GitHub releases/upstreams — no
      # nix, no S3 cache can help it, and ephemeral runners rebuild it
      # from nothing every job. Keyed on .prototools: a pin bump misses
      # once, then everyone is warm again.
      #
      # Path is the WORKSPACE .proto: bar's devbox pins PROTO_HOME to
      # <repo>/.proto (measured 2026-08-14) — the previous ~/.proto
      # path pointed at a directory nothing writes, so this cache
      # silently neither restored nor saved ("Path Validation Error"
      # in every post step, goreleaser-pro re-downloaded every job).
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .proto
        key: proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools') }}

    - name: Install proto toolchain
      if: inputs.proto == 'true' || (inputs.proto == 'auto' && steps.baked.outputs.prototools == 'true')
      # Pure proto now — the closure cost lives in "Materialize devbox
      # environment" above. Retries: proto's plugin fetches are flaky
      # from the NAT'd runner (intermittent non-JSON responses with
      # the token present — consecutive runs disagree); three attempts
      # each, the final one outside the loop so its status propagates.
      shell: bash
      run: |
        retry() { for i in 1 2; do "$@" && return 0; echo "attempt $i failed; sleeping"; sleep 20; done; "$@"; }
        START=$(date +%s)
        retry devbox run -- proto use 2>&1 | tee /tmp/bootstrap-proto.log
        {
          echo "### Bootstrap ($RUNNER_ARCH)"
          echo "- proto use: $(( $(date +%s) - START ))s ($(grep -ac 'installed' /tmp/bootstrap-proto.log || true) install lines; warm cache = near-zero)"
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNNER_ARCH: ${{ runner.arch }}

    # Gated on the App, NOT on go-private. Fetching private Go modules was
    # the first use; reading a sibling repository's files from a recipe is
    # the general one -- TrustForm's OpenAPI contracts sit in a private
    # repository that GITHUB_TOKEN cannot read, which is the same problem
    # wearing different clothes. A caller supplying the App but no
    # go-private now gets a token and no git rewrite, which is exactly
    # what a contracts fetch wants.
    - name: Mint a token for reading private repositories
      if: inputs.module-app-client-id != ''
      id: module-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.module-app-client-id }}
        private-key: ${{ inputs.module-app-private-key }}
        owner: ${{ github.repository_owner }}

    # Hand the token to the recipes as well as to git. A recipe that curls
    # the GitHub API needs the token itself; the credential rewrite below
    # only helps things that speak git.
    #
    # A DISTINCT name, never GH_TOKEN: `gh` reads GH_TOKEN implicitly, so
    # overloading it would silently repoint every unrelated gh call in
    # every recipe at a token scoped to other repositories, and the
    # failure would surface far from here.
    - name: Expose the token to recipes
      if: steps.module-token.outputs.token != ''
      shell: bash
      env:
        MODULE_TOKEN: ${{ steps.module-token.outputs.token }}
      run: |
        set -euo pipefail
        echo "::add-mask::$MODULE_TOKEN"
        # printf, not echo: GITHUB_ENV is line-oriented, so a value
        # carrying a newline writes a second variable of someone else's
        # choosing. A token has none, but the file is append-only and
        # shared, so it is written defensively.
        printf 'CI_CONTENTS_TOKEN=%s\n' "$MODULE_TOKEN" >> "$GITHUB_ENV"

    - name: Reach private Go modules
      if: inputs.go-private != ''
      shell: bash
      # GOPRIVATE alone is not enough and fails in a confusing way: it
      # tells go to skip the proxy and go straight to git, and git then
      # refuses a private repository with an authentication prompt that
      # CI reports as "terminal prompts disabled" — which reads like a
      # git bug rather than a missing credential.
      #
      # The rewrite is global rather than repo-local because `go` clones
      # into its own module cache, outside any checkout, so a --local
      # config would never be consulted.
      #
      # The token arrives through env and is written with a heredoc, not
      # spliced into the command line: a ${{ }} expression is pasted in
      # before bash parses the line, and an argument is visible in `ps`
      # for as long as the process lives.
      run: |
        set -euo pipefail

        # Mask FIRST, so anything below that echoes the token — including
        # a shell trace someone enables while debugging — is redacted.
        echo "::add-mask::$MODULE_TOKEN"

        if [ -z "$MODULE_TOKEN" ]; then
          echo "::error::go-private is set but no module token was minted — check module-app-client-id and module-app-private-key"
          exit 1
        fi

        # GITHUB_ENV is line-oriented: a value carrying a newline writes
        # a SECOND variable of the attacker's choosing. This input comes
        # from a caller's workflow, so it is validated rather than
        # trusted. GOPRIVATE is a comma-separated list of module path
        # patterns, so the alphabet is small and a stray character is far
        # more likely to be a typo than an attack.
        #
        # `[[ =~ ]]`, NOT grep: grep matches line by line, so
        # $'github.com/truvity\nPATH=/evil' passes it — every line
        # satisfies the pattern individually. Bash anchors ^ and $ to the
        # whole string, and newline is outside the class, so the
        # multi-line case is rejected. Measured both ways before
        # choosing.
        if [[ ! "$GO_PRIVATE" =~ ^[A-Za-z0-9._~/*,-]+$ ]]; then
          echo "::error::go-private must be a comma-separated list of module path patterns; got something outside [A-Za-z0-9._~/*,-]"
          exit 1
        fi

        # Belt on top of the validation above: the heredoc write with a
        # random delimiter cannot mint a second variable even if the
        # regex ever loosens (CodeQL envvar-injection).
        d="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        printf '%s<<%s\n%s\n%s\n' GOPRIVATE "$d" "$GO_PRIVATE" "$d" >> "$GITHUB_ENV"

        git config --global --replace-all \
          "url.https://x-access-token:$MODULE_TOKEN@github.com/.insteadOf" \
          "https://github.com/"
      env:
        GO_PRIVATE: ${{ inputs.go-private }}
        MODULE_TOKEN: ${{ steps.module-token.outputs.token }}

    - name: Wire the fleet caches
      if: inputs.go-cache-bucket != ''
      shell: bash
      # Only when asked: hosted runners have no VPC endpoint and no pool
      # identity, so pointing GOCACHEPROG at S3 there would fail every
      # build. Empty means "use the plain Go caches", which is correct.
      run: |
        set -euo pipefail
        {
          echo "GOCACHEPROG=go-cache-plugin"
          echo "GOCACHE_DIR=/tmp/gocache"
          echo "GOCACHE_KEY_PREFIX=gocache"
          echo "GOCACHE_METRICS=1"
        } >> "$GITHUB_ENV"
        # Caller-supplied values go through heredoc writes with random
        # delimiters — the NAME=VALUE form lets a value carrying a
        # newline mint a second variable (CodeQL envvar-injection); the
        # constants above carry no taint and stay plain.
        write_env() {
          local d
          d="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"
        }
        write_env GOCACHE_S3_BUCKET "$CACHE_BUCKET"
        write_env GOCACHE_S3_REGION "$CACHE_REGION"
        if [ -n "$CACHE_GOPROXY" ]; then
          write_env GOPROXY "$CACHE_GOPROXY"
        fi
      env:
        CACHE_BUCKET: ${{ inputs.go-cache-bucket }}
        CACHE_REGION: ${{ inputs.go-cache-region }}
        CACHE_GOPROXY: ${{ inputs.goproxy }}
