# Read one path of secrets from an OpenBAO KV v2 mount, as the JOB — no
# stored credential anywhere.
#
# The chain is the one a laptop already uses, with the job's own identity
# in place of a sign-in:
#
#   1. `accessctl token --audience <audience>` exchanges the job's GitHub
#      OIDC identity token at the access-roster issuer. The issuer's
#      grants decide: a job reaches this audience only if its matchers
#      (repository, ref, event, workflow files) admit it.
#   2. That token logs in at `auth/<auth-mount>/login`, whose role maps
#      the token's groups onto OpenBAO's identity groups, and the policy
#      those carry decides which paths the login may read.
#   3. One read of `<mount>/data/<path>`, then the login is revoked.
#
# Nothing here is rotated, copied into a repository, or held between
# runs. What a leak would cost is one read of one path, for at most the
# life of the login.
#
# SELF-HOSTED ONLY, in practice: `address` is normally a private
# endpoint a GitHub-hosted runner cannot resolve. The step fails plainly
# if it cannot be reached.
#
# NOTHING PARTICULAR LIVES HERE. This repository is public: the issuer,
# the address, the namespace, the mount and the path all arrive as
# inputs, from the caller's variables.
#
# The secrets land two ways, and a caller picks whichever suits:
#
#   value      the single value, when the read returns exactly one key
#              (or `keys` names one). For `GORELEASER_KEY: ${{
#              steps.<id>.outputs.value }}`.
#   env-file   a file of `NAME='value'` lines, one per key read, the
#              name upper-cased with dashes turned into underscores
#              (`maven-username` -> `MAVEN_USERNAME`). A step sources it:
#              `set -a; . "$ENV_FILE"; set +a`. It is written under
#              RUNNER_TEMP with owner-only permissions and dies with the
#              ephemeral runner.
#
# Every value is masked before it is written anywhere, line by line, so
# a multi-line secret is masked whole.
#
# The logic is the `ci-actions` binary's `openbao-secrets` command
# (internal/openbaosecrets, table-tested; no secret value is ever printed
# except as an `::add-mask::` argument, which the tests assert); this action
# is a thin wrapper that finds that binary (release archive of the pinned
# tag, or built with Go) and runs it. accessctl is still the executed
# command that does the exchange. It needs bash plus curl and tar or Go, and
# no jq.
name: Read secrets from OpenBAO
description: Read one KV path as the job's own identity, through an access-roster token exchange.

inputs:
  issuer:
    description: The access-roster issuer URL, which mints the token the login presents.
    required: true
  address:
    description: The OpenBAO API base URL, e.g. https://openbao.example (from a caller variable).
    required: true
  path:
    description: The KV path to read, under the mount's data endpoint — `ci/goreleaser`.
    required: true
  namespace:
    description: >-
      The OpenBAO namespace the path lives in. Empty reads the root
      namespace, which is almost never what a job wants.
    required: false
    default: ""
  mount:
    description: The KV v2 mount inside that namespace.
    required: false
    default: kv
  auth-mount:
    description: The JWT auth mount the exchanged token logs in at.
    required: false
    default: jwt-roster
  role:
    description: The role on that mount; its policies come from the token's groups.
    required: false
    default: roster
  audience:
    description: The exchange audience the token is minted for.
    required: false
    default: openbao
  keys:
    description: >-
      Which keys of the path to take, whitespace- or comma-separated.
      Empty takes every key the read returns.
    required: false
    default: ""
  ca-cert:
    description: >-
      PEM of the CA that signed OpenBAO's certificate, for an endpoint
      the runner's trust store does not cover. A certificate authority is
      not a secret; it still comes from the caller, never from here.
    required: false
    default: ""
  accessctl:
    description: >-
      How to run accessctl: `auto` runs it through devbox when the
      repository has a devbox.json (where every consumer's copy is
      pinned), `direct` runs it from the job's PATH.
    required: false
    default: auto

outputs:
  value:
    description: The one value read, when the read yielded exactly one key.
    value: ${{ steps.read.outputs.value }}
  env-file:
    description: Path to a file of NAME='value' lines, one per key read.
    value: ${{ steps.read.outputs.env-file }}

runs:
  using: composite
  steps:
    - name: Read ${{ inputs.path }} from OpenBAO
      id: read
      shell: bash
      env:
        ISSUER: ${{ inputs.issuer }}
        ADDRESS: ${{ inputs.address }}
        KV_PATH: ${{ inputs.path }}
        BAO_NAMESPACE: ${{ inputs.namespace }}
        MOUNT: ${{ inputs.mount }}
        AUTH_MOUNT: ${{ inputs.auth-mount }}
        ROLE: ${{ inputs.role }}
        AUDIENCE: ${{ inputs.audience }}
        WANTED: ${{ inputs.keys }}
        CA_CERT: ${{ inputs.ca-cert }}
        ACCESSCTL_MODE: ${{ inputs.accessctl }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh"
