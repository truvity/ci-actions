name: tagged-pins
description: >-
  Refuse a pin into one of this estate's shared CI repositories that does
  not name a release. Reads each tag list with `git ls-remote` on a public
  repository, so it needs no token and no API. The rule is the `ci-actions`
  binary's `tagged-pins` command; this action is a thin wrapper that finds
  that binary (release archive of the pinned tag, or built with Go) and
  runs it. Needs git and bash, plus curl and tar or Go.

inputs:
  libraries:
    description: >-
      Whitespace- or comma-separated owner/repo list to judge pins into.
      The default is the shared CI library — the workflows and the actions
      they are built from. A repository that pins neither gets "nothing to
      check" and costs a second.
    required: false
    default: truvity/ci-workflows truvity/ci-actions

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LIBRARIES: ${{ inputs.libraries }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$ACTION_PATH/run.sh"
