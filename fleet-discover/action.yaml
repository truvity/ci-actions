# Which repositories a fleet job works on.
#
# The App's installation is the source: every repository the App can see,
# narrowed by four rules that each have a reason.
#
#   estate        `public` or `private` (or `all`). The public estate's
#                 job runs on GitHub-hosted runners and the private
#                 estate's on a self-hosted pool; a job must never touch
#                 the other estate's repositories, so the App's
#                 installation scope alone is not the boundary — this is.
#   archived      skipped, always. Nothing should open a PR there.
#   require-check the default branch must have at least one REQUIRED
#                 status check, from EITHER a repository ruleset or
#                 classic branch protection. Automation that merges on
#                 green needs a green to wait for; with nothing gating
#                 the merge, a `--auto` merge lands immediately and
#                 unvalidated. A source that cannot be read is
#                 `unknown`, never `no`: the repository is kept and the
#                 summary says the rule was not decided.
#   require-file  a file that marks the repository as opted in
#                 (`renovate.json`, `devbox.json`). Opt-in is a file, not
#                 a workflow — a repository connects nothing in Actions.
#
# Everything reaches the shell through env, never spliced into script
# text. curl + jq only: the self-hosted image ships no gh. The rules
# themselves live in discover.sh next to this file, so they can be
# exercised against a stub API (hack/discover-cases.sh).
name: fleet-discover
description: List the repositories a fleet job should process, from the App installation the token belongs to.

inputs:
  token:
    description: An App INSTALLATION token. The repositories it can see are the candidates.
    required: true
  estate:
    description: "`public`, `private` or `all` — which visibility to keep."
    required: false
    default: all
  require-check:
    description: >-
      Skip repositories whose default branch has no required status
      check. Both sources count: a repository ruleset and classic branch
      protection. A source that cannot be read leaves the rule undecided
      and the repository is kept.
    required: false
    default: "true"
  require-file:
    description: Skip repositories that do not carry this file at the root of the default branch. Empty means no file rule.
    required: false
    default: ""
  filter:
    description: An RE2 regular expression over `owner/name`; only matches are kept. Empty means everything.
    required: false
    default: ""
  repositories:
    description: >-
      JSON array of repository NAMES (no owner) the caller has enrolled.
      When set, only these are kept, and a listed repository the App
      cannot see is reported as an error — the enrolment says it should
      be processed, so its absence is a fault, not a preference. Empty
      means every repository the installation can see.
    required: false
    default: ""
  api-url:
    description: The REST API base. Override only for a test double.
    required: false
    default: https://api.github.com

outputs:
  repositories:
    description: JSON array of `owner/name` strings, sorted.
    value: ${{ steps.discover.outputs.repositories }}
  count:
    description: How many were kept.
    value: ${{ steps.discover.outputs.count }}
  missing:
    description: JSON array of enrolled names the App cannot see (not installed, renamed, deleted).
    value: ${{ steps.discover.outputs.missing }}

runs:
  using: composite
  steps:
    - name: Discover
      id: discover
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        ESTATE: ${{ inputs.estate }}
        REQUIRE_CHECK: ${{ inputs.require-check }}
        REQUIRE_FILE: ${{ inputs.require-file }}
        FILTER: ${{ inputs.filter }}
        ENROLLED: ${{ inputs.repositories }}
        API: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/discover.sh"
