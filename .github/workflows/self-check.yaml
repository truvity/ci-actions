# This repository's own CI, and the one required context: `check`.
#
# Everything here is a composite action somebody else's pull request
# executes. There is no unit test that can be written for that which is
# not this: run the step bodies, against stubs, and read what they do.
# The harnesses under hack/ are those runs.
#
# NO `pins are current` STEP, deliberately, and that absence is the point
# of this repository existing. In ci-workflows, where the workflows and
# the actions lived together, a workflow could not pin the commit that
# introduced the action it ran -- the commit does not exist until the
# merge, and rebase-merge rewrites it -- so a gate had to police the pin
# and every action change became three steps. Nothing here pins anything
# here.
name: self-check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check`, the estate's one canonical required-context name (gitops
  # cfg/github.yaml merge-gate doctrine). It is also the WHOLE merge gate
  # on this repository -- `review: none`, D-2026-09-24 -- so a case that
  # is not run here is a case no one runs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # A workflow with a syntax error does not go red -- GitHub declines
      # to run it, which reads as "no CI configured" rather than as a
      # failure. An estate-wide edit mangled runs-on in ten files on
      # 2026-08-15 and it surfaced only because sibling PRs could not
      # satisfy a required check.
      #
      # It lints the composites too, which is most of what is in here.
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      # The golangci-depguard kit is a hand copy of truvity/policy's
      # lint/golangci-depguard.yaml, pinned by kits.yaml's `source:`. A
      # live read, not a stub: truvity/policy is public and the point is
      # to catch OUR copy falling behind THEIRS, which a stub cannot see.
      - name: policy kit current
        run: ./hack/policy-kit-current.sh

      # What setup-devbox writes into GITHUB_ENV for each cache shape.
      # The branches are EXECUTED against a stubbed environment rather
      # than read, because this composite is estate-wide and reaches a
      # repository only when its pin moves -- so a regression in the
      # bucket path, the one every repository uses today, would be
      # discovered one repository at a time over days.
      - name: cache wiring cases
        run: ./hack/cache-env-cases.sh

      # The no-privilege contract: nothing here may escalate. Runners
      # under the Pod Security restricted profile cannot escalate, and a
      # hosted runner that can is not the contract.
      - name: no-escalation cases
        run: ./hack/no-escalation-cases.sh

      # setup-devbox's first step, one failure at a time.
      - name: preflight cases
        run: ./hack/preflight-cases.sh

      # setup-devbox's devbox install: the release binary, checked against
      # the release's checksums, into RUNNER_TEMP, no privilege and nothing
      # piped into a shell. Against a local directory standing in for the
      # release page.
      - name: install-devbox cases
        run: ./hack/install-devbox-cases.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The Go CLI behind the thin wrappers: the pin guard against local
      # git remotes (it judges a LIST of libraries, and a list is where it
      # can be wrong in a way the single-library shape could not: a second
      # library whose pins are never looked at passes silently), the
      # `fleet pins` resolution against a fake GitHub, and the CLI's exit
      # codes. No network, no token.
      # openbao-secrets (internal/openbaosecrets) is in here too, against a
      # stub OpenBAO and a stub accessctl: the one action that handles
      # secret values, so the tests assert that none is ever printed
      # outside an `::add-mask::` command, that every value (and every
      # line of a multi-line one) is masked before it is written anywhere,
      # and that the login is revoked even when the read fails.
      #
      # caller-parity's comparison (internal/callerparity) is in here too,
      # against a stub API: what counts as a DIFFERENCE between a
      # repository's shared caller workflow and the canonical copy. Too
      # strict and every repository differs over its own prose; too loose
      # and a repository that dropped a trigger reads as at parity.
      #
      # fleet-discover's required-check rule (internal/fleetdiscover) is
      # in here too, against a stub API: the one rule that decides whether
      # a repository is processed at all, and a wrong answer there is
      # silent -- a skipped repository looks exactly like a quiet one.
      - name: go vet and tests
        run: |
          go vet ./...
          go test ./...

      # The release configuration is code too: a typo is found when a tag
      # is cut, which is the worst time.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

      # The thin wrapper that finds the binary, with the binary stubbed.
      - name: wrapper cases (tagged-pins, public-runners, fleet-discover, devbox-parity, caller-parity, openbao-secrets)
        run: ./hack/tagged-pins-wrapper-cases.sh

      # policy-conformance, against fixture repositories: one that meets
      # every rule, then one rule broken at a time. A conformance check
      # that says PASS everywhere cannot be told apart from one that looks
      # at nothing, so each rule is proved to FAIL on its own defect.
      - name: policy-conformance cases
        run: ./hack/policy-conformance-cases.sh

      # cluster's mode: shared hands out this repository's kubeconfig,
      # aws.ini and (optionally) an ECR login, so the one thing that must
      # never be true is a fork pull request reaching it. Run against
      # fake event payloads: no network, no token, and the actual guard
      # script rather than a description of what it should do.
      - name: fork-guard cases
        run: ./hack/fork-guard-cases.sh

      # The guard, asked of this repository. `git ls-remote` needs the
      # tags of the libraries it judges, not of this checkout, so there is
      # nothing to fetch first. Since ci-cache joined the default list
      # (2026-09-29) this DOES find a pin of its own -- setup-devbox's
      # nested `truvity/ci-cache/setup` -- which is exactly why the search
      # covers the whole checkout and not just .github: that pin lives in
      # setup-devbox/action.yaml, not under it.
      - uses: ./tagged-pins

      # The rule this library asks of every public caller, asked of
      # itself. This repository is public and runs hosted, so the expected
      # answer is "ok" -- which is the point. A guard nobody runs is a
      # guard nobody knows is broken.
      - uses: ./public-runners
        with:
          runners: ubuntu-latest
          visibility: ${{ github.event.repository.visibility }}

      # The contract, asked of this repository, and required: a failing rule
      # fails the job. ci-actions has no charts, no Go module and no
      # Justfile, so several rules skip; the rest are judged, and the action
      # runs end to end from a real checkout, fetches its tags and writes
      # its summary.
      #
      # C10 (security.yaml calling ci-workflows) is skipped: this library
      # has a standalone security.yaml, because ci-workflows pins these
      # actions and a pin back would make the two pin each other.
      - uses: ./policy-conformance
        with:
          strict: "true"
          skip: C10
          reason: standalone security.yaml; a pin into ci-workflows would make the libraries pin each other

      # This repository is PUBLIC and its history cannot be unpublished.
      # Everything particular -- account ids, role ARNs, registry hosts,
      # bucket names, internal DNS -- belongs in the caller's org
      # variables.
      - name: leak canary
        run: ./hack/leak-canary.sh

  # The actions' step scripts, run as a Pod Security `restricted` runner:
  # uid 1001, no_new_privs, all capabilities dropped, read-only root. A
  # composite action cannot be run by the runner agent inside a container
  # on a hosted job, so hack/restricted-sim.sh executes each action's
  # `run:` bodies as written, in order, in that container (see its header).
  # The control proves the image DOES escalate without the flag, so a red
  # run is attributable to the contract and not to the image; the
  # self-test proves the job goes red on the pre-v1.6.1 escalating step. NOT part
  # of `check`: it needs docker and builds an image.
  restricted-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: control, the image escalates only without the flag
        run: ./hack/restricted-sim.sh --control

      - name: self-test, a privileged step is rejected
        run: ./hack/restricted-sim.sh --self-test

      - name: setup-devbox and recipe under the restricted profile
        run: ./hack/restricted-sim.sh

  # cluster's mode: kind, proved end to end rather than read: a real
  # release tarball, a real kind cluster, the tools this action installs
  # for itself -- and the background/wait pattern, the one path a plain
  # foregrounded run would never exercise. NOT part of `check`: it needs
  # network and a container runtime, and the box alone measures minutes
  # (hack/kind/README.md, in truvity/policy), which a required context on
  # every pull request should not carry, and stays NOT REQUIRED for a
  # second reason below.
  #
  # v0.8.1 is the first release with reliable NATS verification (fixes the
  # attach race in hack/kind/verify.sh).
  cluster-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # v0.8.1 is pinned as a version, not `master`, so a change to the box
      # does not silently retarget what this job proves.
      - name: launch the box in the background
        uses: ./cluster
        with:
          mode: kind
          policy-version: v0.8.1
          namespace: e2e-test
          background: "true"

      # background: true's whole point: these are known before the
      # cluster is ready, because they are paths and fixed strings, not
      # anything the box computes.
      - name: outputs are set before the cluster is ready
        run: |
          set -euo pipefail
          [ "$GEMAAL_TIER" = kind ]
          [ "$GEMAAL_NAMESPACE" = e2e-test ]
          [ "$SNAPSHOT_REGISTRY" = localhost:5001 ]
          [ -n "$GEMAAL_RELEASE" ]
          [ -n "$KUBECONFIG" ]

      - name: wait for it
        uses: ./cluster
        with:
          mode: wait

      - name: the cluster answers, through the exported KUBECONFIG
        run: kubectl get nodes

      - name: the local registry is reachable from the runner
        run: curl -fsS http://localhost:5001/v2/ >/dev/null

      - name: what the box saw, if it did not come up
        if: failure()
        run: |
          kubectl get pods -A || true
          cat "$RUNNER_TEMP/cluster-action/log" || true
