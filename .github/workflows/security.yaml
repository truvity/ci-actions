# govulncheck over the Go CLI, on its own schedule and never in `check`: a
# new advisory (a standard-library one with no released fix, say) must not
# turn the merge gate red on a change that did not cause it.
#
# STANDALONE rather than a call into truvity/ci-workflows' shared check,
# for the reason auto-release.yaml gives: ci-workflows pins these actions,
# and a pin from here back into it makes the two libraries pin each other.
name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 6 * * *" # daily

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
