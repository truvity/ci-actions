# Publish the ci-actions binary for a release tag.
#
# A release is an annotated vX.Y.Z tag on master. Consumers pin the COMMIT
# of that tag; the thin composite wrappers resolve the commit back to the
# tag and download the archive built here, verified against checksums.txt.
# So a tag that never gets this run is a release whose wrappers fall back
# to building with Go.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
